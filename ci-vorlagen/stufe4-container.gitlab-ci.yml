# Stufe 4: wie Stufe 3 + Integrationstest mit Service-Container + Docker-Image bauen
workflow:
  rules:                                  # keine doppelten Pipelines (Branch + MR)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.python:
  image: python:3.12-slim
  cache:
    key:
      files: [requirements.txt]
    paths: [.cache/pip]
  before_script:
    - pip install -r requirements.txt

info:
  stage: lint
  image: alpine:3.20
  script:
    - 'echo "Umgebung (Projektvariable APP_ENV): ${APP_ENV:-nicht gesetzt}"'
    - 'echo "Geheimnis (maskierte Variable DEMO_TOKEN): ${DEMO_TOKEN:-nicht gesetzt}"'

lint:
  extends: .python
  stage: lint
  script:
    - ruff check .

test:
  extends: .python
  stage: test
  image: python:${PY}-slim
  parallel:
    matrix:
      - PY: ["3.11", "3.12"]
  script:
    - python -m pytest -v --junitxml=report.xml --cov=src --cov-report=term
  coverage: '/TOTAL.*\s(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml

db-check:
  stage: test
  image: postgres:16
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_DB: calc
    POSTGRES_USER: calc
    POSTGRES_PASSWORD: seminar          # nur Testcontainer – echte Secrets gehören in CI/CD-Variablen!
  script:
    - 'for i in $(seq 1 30); do pg_isready -h db -U calc && exit 0; echo "warte auf DB ($i)"; sleep 2; done; exit 1'

build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - export TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - docker build -t calc-service:$TAG .
    - docker run --rm calc-service:$TAG
    # Mit Container Registry zusätzlich:
    # - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # - docker tag calc-service:$TAG $CI_REGISTRY_IMAGE:$TAG
    # - docker push $CI_REGISTRY_IMAGE:$TAG
