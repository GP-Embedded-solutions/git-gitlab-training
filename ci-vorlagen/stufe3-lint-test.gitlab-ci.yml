# Stufe 3: Lint, Matrix-Tests, Coverage, Test-Report, Cache, Variablen
workflow:
  rules:                                  # keine doppelten Pipelines (Branch + MR)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [lint, test]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.python:
  image: python:3.12-slim
  cache:
    key:
      files: [requirements.txt]
    paths: [.cache/pip]
  before_script:
    - pip install -r requirements.txt

info:
  stage: lint
  image: alpine:3.20
  script:
    - 'echo "Umgebung (Projektvariable APP_ENV): ${APP_ENV:-nicht gesetzt}"'
    - 'echo "Geheimnis (maskierte Variable DEMO_TOKEN): ${DEMO_TOKEN:-nicht gesetzt}"'

lint:
  extends: .python
  stage: lint
  script:
    - ruff check .

test:
  extends: .python
  stage: test
  image: python:${PY}-slim
  parallel:
    matrix:
      - PY: ["3.11", "3.12"]
  script:
    - python -m pytest -v --junitxml=report.xml --cov=src --cov-report=term
  coverage: '/TOTAL.*\s(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
